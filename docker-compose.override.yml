version: '3.8'

services:
  backend:
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

  ml-service:
    volumes:
      - ./ml-service:/app
      - ./ml-service/models:/app/models
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    ports:
      - "5173:5173"
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
